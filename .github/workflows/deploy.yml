name: CD Deploy

on:
  push:
    branches: [dev, main]

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/deploy_key deploy@"$VPS_HOST" '
            set -e
            cd /var/www/financiai-staging
            git pull origin dev
            docker compose -p financiai-staging -f compose.prod.yaml up -d --build
            docker compose -p financiai-staging -f compose.prod.yaml exec -T app composer install --no-dev --optimize-autoloader
            docker compose -p financiai-staging -f compose.prod.yaml exec -T app php artisan migrate --force
            docker compose -p financiai-staging -f compose.prod.yaml exec -T app php artisan storage:link
            docker compose -p financiai-staging -f compose.prod.yaml exec -T app php artisan config:cache
            docker compose -p financiai-staging -f compose.prod.yaml exec -T app php artisan route:cache
            docker compose -p financiai-staging -f compose.prod.yaml exec -T app php artisan view:cache
          '

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/deploy_key deploy@"$VPS_HOST" '
            set -e
            cd /var/www/financiai
            git pull origin main
            docker compose -p financiai-prod -f compose.prod.yaml up -d --build
            docker compose -p financiai-prod -f compose.prod.yaml exec -T app composer install --no-dev --optimize-autoloader
            docker compose -p financiai-prod -f compose.prod.yaml exec -T app php artisan migrate --force
            docker compose -p financiai-prod -f compose.prod.yaml exec -T app php artisan storage:link
            docker compose -p financiai-prod -f compose.prod.yaml exec -T app php artisan config:cache
            docker compose -p financiai-prod -f compose.prod.yaml exec -T app php artisan route:cache
            docker compose -p financiai-prod -f compose.prod.yaml exec -T app php artisan view:cache
          '
